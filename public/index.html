<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login Page</title>
  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:#f2f2f2;
    }
    .login-box{
      background:white;
      padding:40px;
      border-radius:10px;
      width:320px;
      box-shadow:0 10px 25px rgba(0,0,0,0.1);
    }
    h2{
      text-align:center;
      margin-bottom:20px;
    }
    .input-group{
      margin-bottom:15px;
    }
    .input-group input{
      width:100%;
      padding:10px;
      border:1px solid #ccc;
      border-radius:6px;
      font-size:14px;
    }
    button{
      width:100%;
      padding:10px;
      border:none;
      background:#007bff;
      color:white;
      border-radius:6px;
      font-size:16px;
      cursor:pointer;
    }
    button:hover{
      background:#0056b3;
    }
    .footer{
      text-align:center;
      margin-top:12px;
      font-size:13px;
      color:#666;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form>
      <div class="input-group">
        <input type="email" placeholder="Email" required />
      </div>
      <div class="input-group">
        <input type="password" placeholder="Password" required />
      </div>
      <button type="submit">Login</button>
    </form>
    <div class="footer">
      Don't have an account? Sign up
    </div>
  </div>
</body>
</html>
