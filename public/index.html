<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Welcome</title>

<style>
  body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#f2f2f2;
    font-family: Arial, Helvetica, sans-serif;
  }

  .box{
    background:white;
    padding:40px;
    border-radius:12px;
    text-align:center;
    width:320px;
    box-shadow:0 10px 25px rgba(0,0,0,0.1);
  }

  h1{
    margin-bottom:20px;
  }

  button{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
  }

  .login{
    background:#007bff;
    color:white;
  }

  .register{
    background:#28a745;
    color:white;
  }
</style>
</head>

<body>

<div class="box">
  <h1>Welcome 👋</h1>
  <p>Select an option</p>

  <button class="login" onclick="goLogin()">Login</button>
  <button class="register" onclick="goRegister()">Register</button>
</div>

<script>
function goLogin(){
  window.location.href = "/login.html";
}

function goRegister(){
  window.location.href = "/register.html";
}
</script>

</body>
</html>
