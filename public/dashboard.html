<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Dashboard</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .box {
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 360px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      background: #dc3545;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h2>Dashboard </h2>
    <p id="msg">Checking authentication...</p>

    <button onclick="logout()">Logout</button>
  </div>
  <script>
    async function checkAuth() {
      const res = await fetch("/dashboard", {
        method: "GET",
        credentials: "include"
      });

      if (res.status === 401 || res.status === 403) {
        window.location.href = "/login.html";
        return;
      }

      const data = await res.json();

      document.getElementById("msg").innerText =
        "Welcome " + data.user.email;
    }

    async function logout() {
      await fetch("/logout", {
        method: "POST",
        credentials: "include"
      });

      window.location.href = "/login.html";
    }

    checkAuth();
  </script>

</body>

</html>
